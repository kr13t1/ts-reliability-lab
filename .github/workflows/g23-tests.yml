name: G2.3 freeze tests
on: [push, pull_request]
jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r g23/requirements.txt
      - run: python -m unittest discover -s g23/tests -v
