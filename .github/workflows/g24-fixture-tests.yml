name: G2.4 unit tests (no raw data)
on:
  push:
    branches:
      - issue-20-g24-constant-run
    paths:
      - 'g24/**'
      - '.github/workflows/g24-fixture-tests.yml'
  pull_request:
    paths:
      - 'g24/**'
      - '.github/workflows/g24-fixture-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install fixed G2.4 dependencies
        run: python -m pip install -r g24/requirements.txt
      - name: Run fixture and malformed-provenance tests
        run: python -m unittest discover -s g24/tests -v
      # Raw WISDM is intentionally NOT committed; full integration cases
      # are skipped by PipelineTests and must be separately rerun by 05.
