name: G1 reproducibility tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-g1:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: g1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install audited pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: G1 tests
        run: python -m pytest -q
