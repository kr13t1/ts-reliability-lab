name: G2.2 read-only parser unit tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-g2-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned dependencies
        run: python -m pip install -r g2/requirements.txt
      - name: Run fixture-only tests (raw not present in CI)
        run: python -m pytest -q g2/tests
